# Render Blueprint — 리포를 연결하면 이 설정대로 웹 서비스가 만들어진다.
# Docker 없이 Node 런타임을 그대로 쓴다.
#
# 배포 후 대시보드에서 환경변수 3개를 채워야 서비스가 healthy 가 된다:
#   MCP_SESSION_KEY    openssl rand -base64 32  (필수 — 없으면 /healthz 가 503)
#   MCP_ALLOWED_HOSTS  배정된 도메인 (예: noteplan-mcp.onrender.com)
#   MCP_ALLOWED_EMAILS 등록을 허용할 계정 (쉼표 구분)
services:
  - type: web
    name: noteplan-mcp
    runtime: node
    plan: free
    rootDir: mcp-server
    buildCommand: npm ci && npm run build
    startCommand: npm run serve
    healthCheckPath: /healthz
    envVars:
      - key: MCP_SESSION_KEY
        sync: false
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: MCP_ALLOWED_EMAILS
        sync: false
